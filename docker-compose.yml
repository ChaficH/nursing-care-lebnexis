services:
  postgres:
    image: postgres:16-alpine
    container_name: lebnexis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lebnexis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lebnexis}
      POSTGRES_DB: ${POSTGRES_DB:-lebnexis_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lebnexis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lebnexis_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lebnexis}:${POSTGRES_PASSWORD:-lebnexis}@postgres:5432/${POSTGRES_DB:-lebnexis_db}
      ML_SERVICE_URL: http://ml-backend:8000
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  ml-backend:
    build:
      context: ./ml-backend
    container_name: lebnexis_ml_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lebnexis}:${POSTGRES_PASSWORD:-lebnexis}@postgres:5432/${POSTGRES_DB:-lebnexis_db}
    ports:
      - "${ML_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml-backend:/app

volumes:
  pgdata:
